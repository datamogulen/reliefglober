<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Reliefglober — jorden med berg och havsdjup i 3D</title>
<meta name="description" content="Interaktiv jordglob där landet reser sig och havsbottnen sjunker ner. Välj relief och skriv ut globen i två färger som STL-filer."/>
<meta property="og:type" content="website"/>
<meta property="og:title" content="Reliefglober — jorden med berg och havsdjup i 3D"/>
<meta property="og:description" content="Land som reser sig, havsbotten som sjunker ner. Välj relief och skriv ut globen i två färger."/>
<meta property="og:url" content="https://hedin.it/relief-globes/"/>
<meta property="og:image" content="https://hedin.it/relief-globes/preview.png"/>
<meta property="og:image:width" content="1200"/>
<meta property="og:image:height" content="630"/>
<meta name="twitter:card" content="summary_large_image"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>"/>
<style>
  :root{ --bg:#0b0f17; --panel:rgba(12,17,28,.94); --text:#e7eefc; --muted:#a9b7d0; --line:rgba(255,255,255,.14); --accent:#6fb3ff; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; color:var(--text); background:var(--bg); overflow:hidden; }
  #c{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #panel{ position:fixed; top:0; right:0; bottom:0; width:350px; background:var(--panel); border-left:1px solid var(--line);
          overflow-y:auto; padding:14px 16px 24px; font-size:14px; }
  #panel header{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  h1{ font-size:20px; margin:0; letter-spacing:.2px; }
  h2{ font-size:12px; text-transform:uppercase; letter-spacing:.9px; color:var(--muted); margin:18px 0 8px; font-weight:600; }
  .lead{ color:var(--muted); margin:8px 0 4px; line-height:1.4; }
  a{ color:var(--accent); }
  #sprak button{ background:none; border:0; font-size:20px; padding:0 2px; cursor:pointer; opacity:.4; }
  #sprak button.aktiv{ opacity:1; }
  .seg{ display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; }
  .seg button{ flex:1; background:transparent; color:var(--text); border:0; padding:8px 4px; cursor:pointer; font-size:13px; }
  .seg button + button{ border-left:1px solid var(--line); }
  .seg button.aktiv{ background:#1f4f8a; }
  .rad{ margin:11px 0 0; }
  .rad .etikett{ display:flex; justify-content:space-between; color:var(--text); }
  .rad output{ color:var(--accent); font-variant-numeric:tabular-nums; }
  .rad.av{ opacity:.4; }
  input[type=range]{ width:100%; margin:5px 0 0; accent-color:var(--accent); }
  .tips{ color:var(--muted); font-size:12px; margin-top:2px; }
  .chk{ display:flex; gap:8px; align-items:center; margin-top:9px; cursor:pointer; }
  .farger{ display:flex; gap:16px; align-items:center; }
  .farger label{ display:flex; gap:6px; align-items:center; }
  input[type=color]{ width:34px; height:24px; border:1px solid var(--line); background:none; padding:0; border-radius:5px; }
  .falt{ display:grid; grid-template-columns:1fr 84px; gap:7px 10px; align-items:center; margin-top:8px; }
  .falt input, .falt select{ width:100%; background:#0a0f1b; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 6px; font-size:13px; }
  .matt{ margin-top:12px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; color:var(--muted); font-size:12.5px; line-height:1.55; }
  .matt b{ color:var(--text); font-weight:600; }
  #bygg{ width:100%; margin-top:12px; padding:10px; font-size:15px; font-weight:600; color:#fff; background:#1f6fd1; border:0; border-radius:9px; cursor:pointer; }
  #bygg:disabled{ opacity:.55; cursor:progress; }
  #status{ margin-top:8px; font-size:12.5px; color:var(--muted); line-height:1.5; }
  #status .ok{ color:#7ddf8a; } #status .fel{ color:#ff8a80; }
  #nedl{ display:flex; gap:8px; margin-top:8px; }
  #nedl a{ flex:1; text-align:center; padding:7px; border:1px solid var(--line); border-radius:8px; text-decoration:none; font-size:13px; }
  .varning{ color:#ffcf6e; font-size:12.5px; margin-top:6px; }
  details{ margin-top:18px; border-top:1px solid var(--line); padding-top:10px; }
  summary{ cursor:pointer; color:var(--muted); }
  details p{ color:var(--muted); line-height:1.5; font-size:13px; }
  .fot{ display:flex; justify-content:space-between; gap:10px; margin-top:16px; font-size:12.5px; }
  .fot a{ color:var(--muted); display:inline-flex; align-items:center; gap:5px; text-decoration:none; }
  .fot a:hover{ color:var(--text); }
  #tips{ position:fixed; pointer-events:none; background:rgba(10,15,27,.9); border:1px solid var(--line); border-radius:7px;
         padding:4px 8px; font-size:12.5px; white-space:nowrap; display:none; font-variant-numeric:tabular-nums; }
  #laddar{ position:fixed; left:0; right:350px; top:50%; text-align:center; color:var(--muted); }
  #panelknapp{ display:none; }
  @media (max-width:760px){
    #panel{ top:auto; left:0; width:auto; height:52vh; border-left:0; border-top:1px solid var(--line); border-radius:14px 14px 0 0; }
    #panel.dold{ transform:translateY(calc(100% - 46px)); }
    #panel header{ padding-right:46px; }
    #panelknapp{ display:block; position:fixed; right:12px; bottom:calc(52vh - 40px); z-index:3; background:#1f4f8a; color:#fff; border:0; border-radius:8px; padding:6px 10px; font-size:15px; }
    body.panelDold #panelknapp{ bottom:6px; }
    #laddar{ right:0; top:22%; }
  }
</style>
<script src="/analytics.js" defer></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="laddar" data-t="laddar">Laddar höjddata …</div>
<div id="tips"></div>
<button id="panelknapp" aria-label="Panel">☰</button>

<aside id="panel">
  <header>
    <h1 data-t="titel">Reliefglober</h1>
    <div id="sprak">
      <button data-sprak="sv" title="Svenska">🇸🇪</button><button data-sprak="en" title="English">🇬🇧</button><button data-sprak="ja" title="日本語">🇯🇵</button>
    </div>
  </header>
  <p class="lead" data-t="lead"></p>

  <h2 data-t="visning">Relief</h2>
  <div class="seg" id="lage">
    <button data-lage="full" data-t="full"></button><button data-lage="platthav" data-t="platthav"></button><button data-lage="plattland" data-t="plattland"></button>
  </div>
  <div class="rad" id="radKLand">
    <div class="etikett"><span data-t="kLand"></span><output id="kLandUt"></output></div>
    <input type="range" id="kLand" min="0" max="1000" step="1"/>
  </div>
  <div class="rad" id="radKHav">
    <div class="etikett"><span data-t="kHav"></span><output id="kHavUt"></output></div>
    <input type="range" id="kHav" min="0" max="1000" step="1"/>
  </div>
  <label class="chk"><input type="checkbox" id="lank"/><span data-t="lank"></span></label>
  <div class="rad">
    <div class="etikett"><span data-t="gamma"></span><output id="gammaUt"></output></div>
    <input type="range" id="gamma" min="0.3" max="1" step="0.05"/>
    <div class="tips" data-t="gammaTips"></div>
  </div>
  <div class="rad">
    <div class="etikett"><span data-t="jamn"></span><output id="jamnUt"></output></div>
    <input type="range" id="jamn" min="0" max="8" step="1"/>
    <div class="tips" data-t="jamnTips"></div>
  </div>

  <h2 data-t="farger">Utseende</h2>
  <div class="farger">
    <label><input type="color" id="fLand"/><span data-t="fLand"></span></label>
    <label><input type="color" id="fHav"/><span data-t="fHav"></span></label>
  </div>
  <label class="chk"><input type="checkbox" id="hojdfarg"/><span data-t="hojdfarg"></span></label>
  <label class="chk"><input type="checkbox" id="kust"/><span data-t="kust"></span></label>

  <h2 data-t="utskrift">Utskrift</h2>
  <div class="falt">
    <span data-t="diameter"></span><input type="number" id="diameter" min="30" max="400" step="5"/>
    <span data-t="upp"></span><select id="upp"><option value="1">1°</option><option value="0.5">0,5°</option><option value="0.25">0,25°</option></select>
    <span data-t="landDjup"></span><input type="number" id="landDjup" min="0.6" max="20" step="0.2"/>
    <span data-t="halD"></span><input type="number" id="halD" min="0" max="30" step="0.5"/>
    <span data-t="halDjup"></span><input type="number" id="halDjup" min="1" max="40" step="0.5"/>
  </div>
  <label class="chk"><input type="checkbox" id="dela"/><span data-t="dela"></span></label>
  <div class="matt" id="matt"></div>
  <div class="varning" id="varning" hidden></div>
  <button id="bygg" data-t="bygg"></button>
  <div id="status"></div>
  <div id="nedl"></div>
  <label class="chk"><input type="checkbox" id="visaUtskrift" disabled/><span data-t="visaUtskrift"></span></label>

  <details>
    <summary data-t="om"></summary>
    <div data-th="omText"></div>
  </details>
  <div class="fot">
    <a href="/">← hedin.it</a>
    <a href="https://github.com/datamogulen/reliefglober" target="_blank" rel="noopener"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38v-1.33c-2.23.48-2.7-1.07-2.7-1.07-.36-.92-.89-1.17-.89-1.17-.73-.5.06-.49.06-.49.8.06 1.23.83 1.23.83.72 1.22 1.87.87 2.33.66.07-.52.28-.87.5-1.07-1.78-.2-3.65-.89-3.65-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48v2.2c0 .21.15.46.55.38A8 8 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg><span data-t="kallkod"></span></a>
  </div>
</aside>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" src="app.js"></script>
</body>
</html>
